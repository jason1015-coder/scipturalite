name: Deploy Scriptura (Manual)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build.yml run ID to package (leave empty for the latest successful run on this branch)'
        required: false
        type: string

concurrency:
  group: deploy-manual-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # download artifacts produced by the build workflow

jobs:
  # The artifact actions can only pull from another run by ID, so resolve the
  # build run once and hand its ID to every packaging job.
  resolve-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve build run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          run_id="${REQUESTED_RUN_ID:-}"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow=build.yml --branch="$GITHUB_REF_NAME" --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow=build.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful build.yml run found to deploy."
            exit 1
          fi
          echo "Packaging artifacts from build run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy-linux:
    runs-on: ubuntu-latest
    needs: resolve-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux executable
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}
          name: scriptura-linux-executable
          path: build/

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file dpkg fakeroot qt6-base-dev qt6-svg-dev libqt6sql6-sqlite

      - name: Determine package version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always 2>/dev/null | sed 's/^v//' || true)"
          [ -n "$VERSION" ] || VERSION="0.0.0-dev"
          # Debian versions must start with a digit.
          case "$VERSION" in
            [0-9]*) ;;
            *) VERSION="0.0.0+$VERSION" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod a+x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Bundle AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/scriptura AppDir/usr/bin/
          cp deployment/linux/scriptura.desktop AppDir/usr/share/applications/ || echo "No desktop file found"
          cp src/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/scriptura.png || echo "No icon found"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=/usr/bin/qmake6
          ./linuxdeploy-x86_64.AppImage --plugin qt --appdir AppDir --output appimage

      - name: Create .deb package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/256x256/apps
          cp build/scriptura deb-package/usr/bin/
          cp deployment/linux/scriptura.desktop deb-package/usr/share/applications/ || echo "No desktop file found"
          cp src/icon.png deb-package/usr/share/icons/hicolor/256x256/apps/scriptura.png || echo "No icon found"
          cat > deb-package/DEBIAN/control <<EOF
          Package: scriptura
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Scriptura <maintainer@example.com>
          Description: A hybrid Qt/Rust text editor with project file browsing
           Scriptura is a Qt+Rust text editor with project file browsing capabilities.
           The Rust backend provides safe protocol handling and infrastructure services.
          Depends: libqt6core6t64, libqt6gui6, libqt6widgets6, libqt6network6, libqt6sql6
          EOF
          dpkg-deb --build deb-package scriptura.deb

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: scriptura-linux-appimage
          path: Scriptura*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux .deb package
        uses: actions/upload-artifact@v7
        with:
          name: scriptura-linux-deb
          path: scriptura.deb
          if-no-files-found: error
          retention-days: 14

  deploy-macos:
    runs-on: macos-latest
    needs: resolve-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download macOS app bundle
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}
          name: scriptura-macos-app
          path: ./

      - name: Extract app bundle
        run: |
          mkdir -p build
          tar xzf scriptura-macos.tar.gz -C build

      - name: Install Qt
        run: brew install qt

      - name: Bundle Qt dependencies
        run: macdeployqt build/scriptura.app -always-overwrite

      - name: Generate app icon
        run: |
          mkdir -p scriptura.iconset
          sips -z 16 16     src/icon.png --out scriptura.iconset/icon_16x16.png
          sips -z 32 32     src/icon.png --out scriptura.iconset/icon_16x16@2x.png
          sips -z 32 32     src/icon.png --out scriptura.iconset/icon_32x32.png
          sips -z 64 64     src/icon.png --out scriptura.iconset/icon_32x32@2x.png
          sips -z 128 128   src/icon.png --out scriptura.iconset/icon_128x128.png
          sips -z 256 256   src/icon.png --out scriptura.iconset/icon_128x128@2x.png
          sips -z 256 256   src/icon.png --out scriptura.iconset/icon_256x256.png
          sips -z 512 512   src/icon.png --out scriptura.iconset/icon_256x256@2x.png
          sips -z 512 512   src/icon.png --out scriptura.iconset/icon_512x512.png
          sips -z 1024 1024 src/icon.png --out scriptura.iconset/icon_512x512@2x.png
          iconutil -c icns scriptura.iconset
          cp scriptura.icns build/scriptura.app/Contents/Resources/

      # NOTE: this artifact is unsigned — no Apple Developer account configured.
      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v7
        with:
          name: scriptura-macos
          path: build/scriptura.app
          if-no-files-found: error
          retention-days: 14

  deploy-windows:
    runs-on: windows-latest
    needs: resolve-build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}
          name: scriptura-windows-executable
          path: build/Release/

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          setup-python: 'true'

      - name: Install NSIS and ImageMagick
        run: choco install nsis imagemagick -y

      - name: Get version from git tag
        id: get_version
        shell: pwsh
        run: |
          $version = (git describe --tags --always 2>$null)
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0-dev" }
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Convert icon to ICO
        shell: pwsh
        run: |
          if (Test-Path "deployment/windows/icon.ico") {
            Copy-Item deployment/windows/icon.ico icon.ico
          } elseif (Test-Path "src/icon.png") {
            magick src/icon.png -resize 256x256 icon.ico
          } else {
            Write-Host "No icon source found, skipping icon conversion"
          }

      - name: Deploy Qt dependencies
        run: windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw build/Release/scriptura.exe

      - name: Package for installer
        shell: pwsh
        run: |
          $src = "build/Release"
          $dst = "deploy/Release"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src/scriptura.exe" $dst
          Get-ChildItem $src -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $dst
          foreach ($dir in @("platforms", "styles", "imageformats", "iconengines", "tls", "networkinformation")) {
            if (Test-Path "$src/$dir") { Copy-Item -Recurse -Force "$src/$dir" $dst }
          }
          if (Test-Path "src/resources") { Copy-Item -Recurse -Force src/resources "$dst/resources" }
          if (Test-Path "icon.ico") { Copy-Item icon.ico $dst }
          Copy-Item LICENSE $dst

      - name: Build NSIS installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          Push-Location deploy/Release
          try {
            $nsi = Get-Content "$env:GITHUB_WORKSPACE/deployment/windows/scriptura.nsi" -Raw
            $nsi = $nsi.Replace('0.0.0-dev', $env:APP_VERSION)
            Set-Content -Path scriptura-temp.nsi -Value $nsi

            $makensis = Get-Command makensis -ErrorAction SilentlyContinue
            if (-not $makensis) {
              $found = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)','C:\ProgramData' -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $found) { throw "makensis.exe not found. Install NSIS via choco or manually." }
              $makensis = $found.FullName
            } else {
              $makensis = $makensis.Source
            }

            & $makensis scriptura-temp.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Create portable ZIP
        run: Compress-Archive -Path deploy/Release/* -DestinationPath Scriptura-Portable.zip

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: scriptura-windows-installer
          path: deploy/Release/Scriptura-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable
        uses: actions/upload-artifact@v7
        with:
          name: scriptura-windows-portable
          path: Scriptura-Portable.zip
          if-no-files-found: error
          retention-days: 14
