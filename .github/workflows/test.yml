name: Run Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  CARGO_CACHE_VERSION: v1

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust_backend/target
          key: ${{ runner.os }}-cargo-test-${{ env.CARGO_CACHE_VERSION }}-${{ hashFiles('src/rust_backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ env.CARGO_CACHE_VERSION }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ zlib1g-dev qt6-base-dev qt6-svg-dev qt6-tools-dev libqt6sql6-sqlite lcov

      - name: Run Rust tests
        working-directory: src/rust_backend
        run: cargo test

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build C++ tests
        run: cmake --build build --config Debug -j"$(nproc)" --target scriptura_tests

      - name: Run C++ unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          ctest --output-on-failure --timeout 600

      - name: Generate coverage report
        run: |
          # lcov 2.x reports "inconsistent" (a line is hit but none of its
          # branches were evaluated) for template code in libstdc++ headers;
          # that is not an error in this project's own sources.
          lcov --capture --directory build --output-file coverage.info \
            --rc branch_coverage=1 --ignore-errors mismatch,gcov,source,inconsistent
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info \
            --rc branch_coverage=1 --ignore-errors unused,inconsistent
          lcov --list coverage.info --rc branch_coverage=1 --ignore-errors inconsistent

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.info
          if-no-files-found: warn
          retention-days: 7

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust_backend/target
          key: ${{ runner.os }}-cargo-test-${{ env.CARGO_CACHE_VERSION }}-${{ hashFiles('src/rust_backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ env.CARGO_CACHE_VERSION }}-

      - name: Install Qt
        run: brew install qt

      - name: Run Rust tests
        working-directory: src/rust_backend
        run: cargo test

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build C++ tests
        run: cmake --build build --config Debug -j"$(sysctl -n hw.ncpu)" --target scriptura_tests

      - name: Run C++ unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          ctest --output-on-failure --timeout 1200

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          setup-python: 'true'

      - name: Install vcpkg dependencies
        run: vcpkg install zlib:x64-windows

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust_backend/target
          key: ${{ runner.os }}-cargo-test-${{ env.CARGO_CACHE_VERSION }}-${{ hashFiles('src/rust_backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ env.CARGO_CACHE_VERSION }}-

      - name: Run Rust tests
        working-directory: src/rust_backend
        run: cargo test

      # NOTE: Windows tests MUST build in Release (or RelWithDebInfo), not Debug.
      # A Debug build selects Qt's pre-built debug libraries (Qt6Cored.lib, etc.)
      # which are compiled with the debug CRT (/MDd), while this project's C++
      # code and the Rust release staticlib use the release CRT (/MD). Mixing the
      # two CRTs in one process gives each its own heap manager (ucrtbase.dll vs
      # ucrtbased.dll); freeing memory across that boundary corrupts the heap,
      # crashing the test binary with STATUS_HEAP_CORRUPTION (0xc0000374) shortly
      # after startup on Windows. Release selects Qt's release libraries (/MD) so
      # the whole process shares a single CRT.
      - name: Configure (MSVC)
        run: cmake -B build -S . -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build C++ tests
        run: cmake --build build --config Release --target scriptura_tests

      - name: Run C++ unit tests
        shell: pwsh
        run: |
          if ($env:QT_ROOT_DIR) { $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH" }
          $env:QT_QPA_PLATFORM = "offscreen"
          Push-Location build
          try {
            ctest --output-on-failure -C Release --timeout 600
            if ($LASTEXITCODE -ne 0) { throw "ctest failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
