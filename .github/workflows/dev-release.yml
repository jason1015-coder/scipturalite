name: Dev Release (update dev tag)

# Rolling development release.
#
# This workflow is lazy: it does NOT start on every push. Instead it triggers
# ONLY when "Deploy Scriptura (Manual)" workflow COMPLETES.
# If deploy passed -> it immediately creates/updates the "dev" tag /
# "scriptura-lite-dev" release with every artifact. If it failed it does nothing.

on:
  workflow_run:
    workflows: ["Deploy Scriptura (Manual)"]
    types: [completed]

permissions:
  contents: write   # update/create the release and move the git tag
  actions: read     # list run status and download artifacts of other workflows

concurrency:
  group: dev-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  update-dev-release:
    name: Update scriptura-lite-dev release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only act on pushed commits. PR-triggered runs are ignored.
    if: github.event.workflow_run.event == 'push'
    steps:
      # ── Gate: deploy must have passed ──
      - name: Check deploy passed
        id: gate
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "Deploy conclusion=$DEPLOY_CONCLUSION"
          if [ "$DEPLOY_CONCLUSION" != "success" ]; then
            echo "::warning::Deploy did not pass ($DEPLOY_CONCLUSION); skipping dev release."
            echo "gated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::Deploy passed. Publishing dev release."
          echo "gated=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.gated == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # ── Download ALL artifacts produced by the deploy run ──
      - name: Download deploy artifacts
        if: steps.gate.outputs.gated == 'true'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build-artifacts

      # ── Package each artifact into exactly one release asset ──
      - name: Stage release assets
        if: steps.gate.outputs.gated == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-assets

          shopt -s nullglob
          for dir in build-artifacts/*/; do
            name="$(basename "$dir")"
            ( cd "$dir" && zip -q -r "$GITHUB_WORKSPACE/release-assets/${name}.zip" . )
            echo "Staged release-assets/${name}.zip"
          done

          echo "=== Release assets ==="
          ls -la release-assets/

      # ── Create or UPDATE the dev tag / scriptura-lite-dev release ──
      # Fixed tag name => the existing release is updated in place; the tag is
      # created against the commit that was actually deployed.
      - name: Create/update dev release
        if: steps.gate.outputs.gated == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: scriptura-lite-dev
          body: |
            Rolling development build (auto-generated).

            - Updated when **Deploy Scriptura (Manual)** succeeds
              on the `main` branch.
            - Assets always overwrite the previous `dev` build.
            - Commit: ${{ github.event.workflow_run.head_sha }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
